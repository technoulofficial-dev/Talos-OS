version: "3.9"

services:
  # --- PostgreSQL (Supabase-compatible) ---
  postgres:
    image: supabase/postgres:15.6.1
    container_name: talos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: talos
      POSTGRES_USER: talos
      POSTGRES_PASSWORD: talos_dev_password
      POSTGRES_PORT: 5432
    volumes:
      - talos_postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talos -d talos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis (Loom pub/sub + caching) ---
  redis:
    image: redis:7-alpine
    container_name: talos-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - talos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Ollama (Local LLM engine) ---
  ollama:
    image: ollama/ollama:latest
    container_name: talos-ollama
    ports:
      - "11434:11434"
    volumes:
      - talos_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Talos Core (orchestrator process) ---
  talos-core:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.core
    container_name: talos-core
    ports:
      - "8642:8642"
    environment:
      - NODE_ENV=development
      - SUPABASE_URL=http://postgres:54321
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  talos_postgres_data:
  talos_redis_data:
  talos_ollama_data: